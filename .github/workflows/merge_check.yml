name: MergeCheck
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate conference YAML
        run: python scripts/validate.py
      - name: Validate competition whitelist
        run: python scripts/validate_competition.py
      - name: Competition validation tests
        run: python scripts/test_validate_competition.py
      - name: Assemble yml files
        run: python scripts/build_data.py
      - name: Generate iCal files
        run: python extensions/cli/ccfddl/convert_to_ical.py --output-dir public/conference/deadlines
      - name: Generate RSS feeds
        run: python extensions/cli/ccfddl/convert_to_rss.py --output-dir public/conference/deadlines
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Download and install Trunk binary
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.18.4/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
      - name: Build with Trunk
        run: ./trunk build --release
      - name: Generate whitelist competition pages
        run: python scripts/generate_competition_pages.py
