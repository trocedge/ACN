name: healthcheck
# 新增：每日探活 + 手动触发；不改动既有 deploy / merge_check / mcp_check / pre-commit / data-check
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install PyYAML
      - name: 数据探活（含快照新鲜度与源档案校验）
        run: python docs/ci-templates/healthcheck.py --json healthcheck.json
      - name: 状态重算演练（只报告不写回）
        run: python scripts/refresh_status.py --dry
      - name: 归档报告
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: healthcheck-report, path: healthcheck.json}
