repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
        # competition/import-template.csv 是给 Excel 直接打开用的模板，
        # BOM 是刻意保留的：没有它 Excel 会把中文读成乱码。
        # scripts/csv_to_whitelist.py 以 utf-8-sig 读取，BOM 不会污染表头。
        exclude: ^competition/import-template\.csv$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: validate
        name: Validate Conference yaml files
        entry: python scripts/validate.py
        language: python
        additional_dependencies: [PyYAML, jsonschema]
        types: [python]
  - repo: https://github.com/google/yamlfmt
    rev: v0.17.2
    hooks:
      - id: yamlfmt
        name: Format YAML files
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.33.1
    hooks:
      - id: check-github-workflows
        name: Check GitHub Workflow configuration
